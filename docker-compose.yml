# Project name comes from the directory (top-level `name:` needs Compose ≥2.3,
# and the local machine runs 2.2.3).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_USER: ${N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Not published: only reachable on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    # Pinned, not `latest`: upgrades happen deliberately (change tag → pull →
    # up). 2.x needs Postgres (we have it) and enables task runners by default
    # (already on below). NB: images ≥ ~1.5x use zstd layers — Docker engine
    # must be reasonably fresh (local 20.10.12 cannot unpack them; the dev
    # override pins 1.45.1 until Docker Desktop is updated).
    image: n8nio/n8n:2.32.7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Editor on its own subdomain (n8n login + 2FA); webhooks and forms stay
      # on the main domain so their URLs survive the split.
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: ${TZ:-Europe/Kyiv}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PAYLOAD_SIZE_MAX: "16"
      # The rfp-main workflow's first IF node compares the incoming
      # X-Webhook-Secret header against this (A4).
      RFP_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      # Bearer for the KB briefing endpoint (rfp-main post-done nodes).
      RFP_KB_TOKEN: ${KB_MCP_TOKEN:-}
      # n8n 2.x blocks $env access from nodes by default; the secret check
      # above needs it. Scoped alternative if this ever feels too wide:
      # webhook-node Header Auth credential instead of the IF node.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/backup
    ports:
      # A4: the editor is NOT public. Loopback only — reach it over Tailscale
      # or an SSH tunnel. Caddy exposes /webhook/* and /form/* publicly.
      - "127.0.0.1:5678:5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Prod-only: local dev runs without TLS/domain (docker-compose.override.yml).
    # On the server: docker compose -f docker-compose.yml --profile prod up -d
    profiles: ["prod"]
    depends_on:
      - n8n
      - admin
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ADMIN_FORM_USER: ${ADMIN_FORM_USER}
      ADMIN_FORM_PASSWORD_HASH: ${ADMIN_FORM_PASSWORD_HASH}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

  worker:
    build:
      # Кореневий контекст, як в admin і kbmcp — див. коментар у worker/Dockerfile.
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/rfp-item}
    command: ["loop"]
    volumes:
      - ./migrations:/app/migrations:ro

  kbmcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KB_MCP_TOKEN: ${KB_MCP_TOKEN:-}
      USER_AGENT: ${USER_AGENT:-}
      # Briefing packs: unset key = deterministic tier only (still useful).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      # kbmcp тепер тримає чат — «зелений» деплой зі зламаним kbmcp неприйнятний.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # Local Claude Code connects here. On the VPS this must instead be routed
      # through Caddy on a public path (Anthropic infra has to reach it) with
      # the bearer token REQUIRED — see KB-Module-Design §11.
      - "127.0.0.1:8765:8000"

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      MOCK_N8N: ${MOCK_N8N:-false}
      KBMCP_URL: http://kbmcp:8000
      KB_MCP_TOKEN: ${KB_MCP_TOKEN:-}
      # Сесійний логін дашборда. Порожній DASHBOARD_PASSWORD або SESSION_SECRET
      # коротший за 32 символи → контейнер навмисно не стартує (admin/auth.py).
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      DASHBOARD_USERS: ${DASHBOARD_USERS:-}
      # Пункт меню «n8n». Плоске значення в .env — вкладену інтерполяцію
      # ${N8N_URL:-https://n8n.${DOMAIN}} компоуз 2.2.3 псує мовчки.
      N8N_URL: ${N8N_URL}
    healthcheck:
      # Обов'язковий у тому ж коміті, що й fail-fast на env: інакше
      # `restart: unless-stopped` + RuntimeError = нескінченний crash-loop, а
      # `docker compose ps` показує контейнер, що рестартиться, як «running».
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      # F16: дашборд ТЕПЕР публічний — Caddy віддає йому все, що не
      # /webhook/*, /form/*, /form-waiting-room/* (комміт c5d3e68). Межа
      # безпеки — сесійний логін у застосунку (admin/auth.py), а не мережа.
      # Цей порт лишається аварійним входом для інженерів, коли Caddy або
      # домен зламані (Runbook: ssh -N -L 8080:localhost:8080). Логін діє й
      # тут; cookie автоматично без Secure, бо схема http.
      - "127.0.0.1:8080:8000"

  tgbot:
    build:
      context: .
      dockerfile: tgbot/Dockerfile
    restart: unless-stopped
    depends_on:
      kbmcp:
        condition: service_healthy
    environment:
      KBMCP_URL: http://kbmcp:8000
      KB_MCP_TOKEN: ${KB_MCP_TOKEN:-}
      CHAT_TELEGRAM_TOKEN: ${CHAT_TELEGRAM_TOKEN:-}
      CHAT_TELEGRAM_ALLOWED_IDS: ${CHAT_TELEGRAM_ALLOWED_IDS:-}
      TZ: ${TZ:-Europe/Kyiv}
      TGBOT_STATE_DIR: /data
    # окремий бот для AI-чату; порожній CHAT_TELEGRAM_TOKEN → сервіс спить
    # (навмисно, щоб не крутився в crash-loop).
    volumes:
      # Динамічний allowlist інвайтів (allowlist.json) переживає рестарти.
      - tgbot_state:/data

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
  tgbot_state:
